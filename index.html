<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7">
  <meta name="description" content="Today's and tomorrow's CuMeal menu.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>CuMeal</title>
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <p id="date" class="date"></p>
      </div>
      <button id="refresh" class="icon-button" type="button" aria-label="Refresh menu">↻</button>
    </header>

    <div class="day-picker" role="tablist" aria-label="Menu day">
      <button class="day-button active" data-day="today" role="tab" aria-selected="true">Today</button>
      <button class="day-button" data-day="tomorrow" role="tab" aria-selected="false">Tomorrow</button>
      <button class="day-button" data-day="timings" role="tab" aria-selected="false">Timings</button>
    </div>

    <section id="menu" class="menu" aria-live="polite">
      <p class="status">Loading menu…</p>
    </section>

    <section id="timings" class="timings" aria-labelledby="timings-title" hidden>
      <h2 id="timings-title">Mess timings</h2>
      <div class="timing-group">
        <h3>Monday to Friday</h3>
        <p><span>Breakfast</span><strong>7:30 AM – 9:00 AM</strong></p>
        <p><span>Lunch</span><strong>12:00 PM – 1:45 PM</strong></p>
        <p><span>Snacks</span><strong>4:30 PM – 5:15 PM</strong></p>
        <p><span>Dinner</span><strong>7:30 PM – 9:00 PM</strong></p>
      </div>
      <div class="timing-group">
        <h3>Weekend and holidays</h3>
        <p><span>Breakfast</span><strong>8:00 AM – 9:30 AM</strong></p>
        <p><span>Lunch</span><strong>12:30 PM – 2:00 PM</strong></p>
        <p><span>Snacks</span><strong>4:30 PM – 5:15 PM</strong></p>
        <p><span>Dinner</span><strong>7:30 PM – 9:00 PM</strong></p>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
